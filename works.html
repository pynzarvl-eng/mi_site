  <div class="wrap">

    </nav>

<main id="main">

<section class="page-head">
  <div class="wrap">
    <h1>Работы</h1>
    <p>Всё, что сейчас в наличии или недавно уехало к новым хозяевам. Нажмите на работу, чтобы рассмотреть её.</p>
  </div>
</section>

<section class="section" style="padding-top:1rem">
  <div class="wrap">
    <div class="filters" role="group" aria-label="Фильтр по типу работ">
      <button class="chip" type="button" data-cat="all" aria-pressed="true">Все</button>
      <button class="chip" type="button" data-cat="vases" aria-pressed="false">Вазы</button>
      <button class="chip" type="button" data-cat="tableware" aria-pressed="false">Чаши и кружки</button>
      <button class="chip" type="button" data-cat="plates" aria-pressed="false">Тарелки</button>
    </div>
    <div class="gallery" id="gallery">
      <button class="item" type="button" data-cat="vases" data-img="img/vase-cobalt.svg" data-title="Ваза «Кобальт»" data-desc="Высокая ваза с узким горлом и охристой полосой по плечу." data-size="высота 34 см" data-glaze="кобальт, охра" data-fire="1240 °C"><img src="img/vase-cobalt.svg" alt="" width="600" height="600" loading="lazy"><span><b>Ваза «Кобальт»</b>высота 34 см</span></button>
      <button class="item" type="button" data-cat="vases" data-img="img/jug-slate.svg" data-title="Кувшин «Грифель»" data-desc="Кувшин с широкой ручкой. Глазурь переливается от серого к синему." data-size="высота 26 см, 1,2 л" data-glaze="серый глянец" data-fire="1240 °C"><img src="img/jug-slate.svg" alt="" width="600" height="600" loading="lazy"><span><b>Кувшин «Грифель»</b>высота 26 см, 1,2 л</span></button>
      <button class="item" type="button" data-cat="vases" data-img="img/moon-jar.svg" data-title="Лунная банка" data-desc="Круглая банка с мелкими вкраплениями в глине, глазурь матовая." data-size="высота 30 см" data-glaze="кость, матовая" data-fire="1260 °C"><img src="img/moon-jar.svg" alt="" width="600" height="600" loading="lazy"><span><b>Лунная банка</b>высота 30 см</span></button>
      <button class="item" type="button" data-cat="tableware" data-img="img/bowl-celadon.svg" data-title="Чаша «Селадон»" data-desc="Широкая чаша для супа или фруктов. Цвет похож на тонкий лёд." data-size="диаметр 22 см" data-glaze="селадон" data-fire="1240 °C"><img src="img/bowl-celadon.svg" alt="" width="600" height="600" loading="lazy"><span><b>Чаша «Селадон»</b>диаметр 22 см</span></button>
      <button class="item" type="button" data-cat="tableware" data-img="img/cup-ochre.svg" data-title="Кружка «Охра»" data-desc="Кружка на 300 мл с рукой, которая сама ложится в ладонь." data-size="высота 9 см, 300 мл" data-glaze="охра, синий пояс" data-fire="1220 °C"><img src="img/cup-ochre.svg" alt="" width="600" height="600" loading="lazy"><span><b>Кружка «Охра»</b>высота 9 см, 300 мл</span></button>
      <button class="item" type="button" data-cat="tableware" data-img="img/bowl-cobalt.svg" data-title="Пиала «Синий час»" data-desc="Пиала для чая. Глазурь стекает неровно, поэтому оттенок у каждой свой." data-size="диаметр 11 см" data-glaze="кобальт" data-fire="1240 °C"><img src="img/bowl-cobalt.svg" alt="" width="600" height="600" loading="lazy"><span><b>Пиала «Синий час»</b>диаметр 11 см</span></button>
      <button class="item" type="button" data-cat="plates" data-img="img/plate-porcelain.svg" data-title="Тарелка с синим кольцом" data-desc="Фарфоровая тарелка с тонкой кобальтовой линией по кругу." data-size="диаметр 26 см" data-glaze="белая, кобальт" data-fire="1260 °C"><img src="img/plate-porcelain.svg" alt="" width="600" height="600" loading="lazy"><span><b>Тарелка с синим кольцом</b>диаметр 26 см</span></button>
      <button class="item" type="button" data-cat="plates" data-img="img/plate-ochre.svg" data-title="Тарелка «Солнечные точки»" data-desc="Охристая тарелка, по краю ручная роспись кобальтом." data-size="диаметр 24 см" data-glaze="охра, кобальт" data-fire="1220 °C"><img src="img/plate-ochre.svg" alt="" width="600" height="600" loading="lazy"><span><b>Тарелка «Солнечные точки»</b>диаметр 24 см</span></button>
    </div>
  </div>
</section>

<dialog class="lightbox" id="lightbox" aria-labelledby="lb-title">

      <dl>
        <dt>Размер</dt><dd id="lb-size"></dd>

        <dt>Обжиг</dt><dd id="lb-fire"></dd>
      </dl>
      <a class="btn" id="lb-ask" href="contacts.html">Хочу такую же</a>
    </div>
  </div>
</dialog>
